<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Анатомический квест — биология, 8 класс</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#153a30;background:#ecf7f0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#b7efd4,transparent 42%),#ecf7f0;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:22px 16px 55px}a{color:#196d55;text-decoration:none;font-weight:700}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.chip{background:#d4f4e3;border:1px solid #b0e2c7;border-radius:30px;padding:9px 14px;font-size:13px;font-weight:700}h1{font-size:clamp(29px,5vw,47px);line-height:1.12;margin:28px 0 12px}p{line-height:1.55;color:#537368}.lead{max-width:620px}.card{background:white;border:1px solid #d6e9df;border-radius:25px;box-shadow:0 14px 38px #164e3020;padding:clamp(20px,5vw,38px);margin-top:26px}.stages{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stage{background:#e8f2ed;color:#5a776a;border-radius:14px;padding:10px 12px;font-size:12px;font-weight:700}.stage.active{background:#16684e;color:white}.stage.done{background:#b7e7cd;color:#155a43}.bar{height:12px;background:#e3f1e8;border-radius:20px;overflow:hidden;margin:18px 0 24px}.fill{height:100%;width:0;background:linear-gradient(90deg,#19aa77,#74dca2);transition:width .35s}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#537368;font-size:14px;font-weight:700}.question{font-size:clamp(20px,3.5vw,27px);font-weight:800;line-height:1.4;margin:24px 0}.options{display:grid;gap:11px}.option{border:2px solid #dbeae0;border-radius:14px;padding:16px;text-align:left;background:#f9fdfb;font:inherit;font-weight:650;color:#1c4a39;cursor:pointer;transition:.15s}.option:hover:not(:disabled){border-color:#35a87c;background:#eaf9f1}.option:disabled{cursor:default}.option.correct{border-color:#0d9e62;background:#d8f7e5}.option.wrong{border-color:#d85b55;background:#ffeded}.feedback{margin-top:18px;padding:17px;border-radius:14px;background:#edf7f0;display:none;line-height:1.55}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:5px}.next{background:#176f51;border:0;border-radius:13px;padding:14px 22px;color:white;font:inherit;font-weight:800;cursor:pointer;margin-top:19px;display:none}.next:hover{background:#0e533d}.finish{text-align:center}.finish h2{font-size:31px}.score{font-size:56px;font-weight:900;color:#16865b;margin:14px}.muted{font-size:13px;color:#698277}footer{margin-top:26px;text-align:center;font-size:13px;color:#698277}@media(max-width:520px){.card{border-radius:18px}.option{padding:13px}.stage{flex:1;text-align:center}}
</style></head><body><main class="wrap"><div class="top"><a href="index.html">← К банку игр</a><span class="chip">🫀 Биология · 8 класс</span></div><h1>🫀 Анатомический квест</h1><p class="lead">Исследуй организм человека: узнай системы органов, разберись в их работе и пройди анатомический экзамен!</p><div class="stages" id="stages"></div><section class="card" id="game"><div class="meta"><span id="counter"></span><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" type="button">Следующий вопрос →</button></section><footer>12 вопросов · 3 этапа · максимум 180 баллов · без регистрации</footer></main><script>
const questions=[{"question": "Какая система органов обеспечивает перенос кислорода и питательных веществ по организму?", "options": ["Пищеварительная", "Кровеносная", "Нервная", "Покровная"], "answer": 1, "explanation": "Кровеносная система переносит вещества с кровью по организму."}, {"question": "Какой орган является основным насосом кровеносной системы?", "options": ["Печень", "Лёгкое", "Сердце", "Почка"], "answer": 2, "explanation": "Сердце сокращается и обеспечивает движение крови по сосудам."}, {"question": "Какая система органов отвечает за газообмен между организмом и внешней средой?", "options": ["Дыхательная", "Опорно-двигательная", "Выделительная", "Пищеварительная"], "answer": 0, "explanation": "Дыхательная система обеспечивает поступление кислорода и выведение углекислого газа."}, {"question": "Где происходит основное всасывание питательных веществ после переваривания пищи?", "options": ["В пищеводе", "В тонком кишечнике", "В желудке", "В ротовой полости"], "answer": 1, "explanation": "Большинство питательных веществ всасывается через стенки тонкого кишечника."}, {"question": "В каких структурах лёгких происходит газообмен с кровью?", "options": ["В трахее", "В гортани", "В альвеолах", "В бронхах"], "answer": 2, "explanation": "Тонкие стенки альвеол и капилляров обеспечивают обмен кислорода и углекислого газа."}, {"question": "Какие кровеносные сосуды несут кровь ОТ сердца?", "options": ["Вены", "Капилляры", "Артерии", "Лимфатические сосуды"], "answer": 2, "explanation": "Артерии направляют кровь от сердца; вены возвращают её к сердцу."}, {"question": "Какова главная функция эритроцитов?", "options": ["Защита от микробов", "Перенос кислорода", "Свёртывание крови", "Выработка желчи"], "answer": 1, "explanation": "Гемоглобин в эритроцитах связывает и переносит кислород."}, {"question": "Какая структура является основной функциональной единицей почки?", "options": ["Нейрон", "Нефрон", "Альвеола", "Ворсинка"], "answer": 1, "explanation": "Нефрон участвует в фильтрации крови и образовании мочи."}, {"question": "Какую функцию выполняет мозжечок?", "options": ["Образует желчь", "Координирует движения и равновесие", "Переносит кислород", "Фильтрует кровь"], "answer": 1, "explanation": "Мозжечок помогает согласовывать движения и сохранять равновесие."}, {"question": "Как называется место подвижного соединения двух или нескольких костей?", "options": ["Сустав", "Сухожилие", "Мышечное волокно", "Капилляр"], "answer": 0, "explanation": "Сустав обеспечивает подвижное соединение костей."}, {"question": "Какая система обеспечивает быструю передачу сигналов между органами?", "options": ["Нервная", "Пищеварительная", "Дыхательная", "Выделительная"], "answer": 0, "explanation": "Нервная система передаёт сигналы с помощью нервных импульсов."}, {"question": "Какой орган вырабатывает желчь, участвующую в переваривании жиров?", "options": ["Желудок", "Поджелудочная железа", "Печень", "Толстый кишечник"], "answer": 2, "explanation": "Желчь образуется в печени и помогает эмульгировать жиры."}];
const names=['🫀 Системы органов','🫁 Работа органов','🧠 Анатомический экзамен'];let current=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){if(current===questions.length){finish();return}answered=false;const q=questions[current];$('counter').textContent=`Вопрос ${current+1} из ${questions.length}`;$('points').textContent=`⭐ ${score} / 180 баллов`;$('fill').style.width=`${current/questions.length*100}%`;$('question').textContent=q.question;$('feedback').className='feedback';$('feedback').textContent='';$('next').style.display='none';$('next').textContent=current===11?'Завершить миссию ✓':'Следующий вопрос →';$('options').replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>choose(i);$('options').append(b)});$('stages').replaceChildren();names.forEach((n,i)=>{const e=document.createElement('span');e.className='stage'+(i===Math.floor(current/4)?' active':i<Math.floor(current/4)?' done':'');e.textContent=n;$('stages').append(e)})}
function choose(i){if(answered)return;answered=true;const q=questions[current],correct=i===q.answer,worth=[10,15,20][Math.floor(current/4)];if(correct)score+=worth;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=$('feedback');f.className='feedback show';const t=document.createElement('strong');t.textContent=correct?`✅ Верно! +${worth} баллов`:'💡 Не совсем верно';const e=document.createElement('span');e.textContent=q.explanation;f.append(t,e);$('points').textContent=`⭐ ${score} / 180 баллов`;$('fill').style.width=`${(current+1)/questions.length*100}%`;$('next').style.display='inline-block'}
$('next').onclick=()=>{current++;render()};function finish(){$('stages').replaceChildren();$('game').className='card finish';$('game').replaceChildren();const h=document.createElement('h2');h.textContent=score>=150?'🏆 Анатомический эксперт!':score>=100?'💪 Отличный исследователь!':'🔍 Изучай организм дальше!';const s=document.createElement('div');s.className='score';s.textContent=score+' / 180';const d=document.createElement('p');d.textContent=score>=150?'Отличное знание анатомии человека!':score>=100?'Хороший результат! Повтори трудные темы и попробуй ещё раз.':'Повтори системы органов и их основные функции.';const b=document.createElement('button');b.className='next';b.style.display='inline-block';b.textContent='↻ Пройти ещё раз';b.onclick=()=>{current=0;score=0;$('game').className='card';$('game').innerHTML='<div class="meta"><span id="counter"></span><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" type="button">Следующий вопрос →</button>';$('next').onclick=()=>{current++;render()};render()};$('game').append(h,s,d,b)}render();
</script></body></html>
