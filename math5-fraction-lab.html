<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лаборатория дробей · Математика, 5 класс</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#20343c;font-family:system-ui,'Segoe UI',Arial,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:30px 18px 65px}.back{color:#376965;text-decoration:none;font-size:14px}.hero{margin:22px 0;background:#142830;color:white;border-radius:22px;padding:34px}.eyebrow{color:#b8d9cc;font-size:12px;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,43px);margin:14px 0 8px;letter-spacing:-.04em}.hero p{color:#c0d0cf;line-height:1.6}.stats{display:flex;gap:15px;flex-wrap:wrap;margin-top:20px;font-size:13px}.stats span{padding:8px 12px;border:1px solid #4a666a;border-radius:9px}.panel{background:white;border:1px solid #e0e8e5;border-radius:20px;padding:28px;box-shadow:0 10px 35px #1b33330a}.progress{height:8px;background:#e6eeeb;border-radius:20px;overflow:hidden;margin:14px 0 27px}.fill{height:100%;background:#397f74;width:0;transition:width .3s}.small{font-size:13px;color:#60777b}.question{font-size:23px;line-height:1.4;margin:18px 0 23px}.options{display:grid;gap:11px}.option{display:block;width:100%;text-align:left;border:1px solid #dce6e2;background:#fafcfb;padding:16px 18px;border-radius:12px;font-size:16px;color:#20343c;cursor:pointer;transition:.2s}.option:hover:not(:disabled){border-color:#3f8277;background:#eef6f2}.option:disabled{cursor:default}.option.correct{background:#e3f4e9;border-color:#2f9466}.option.wrong{background:#fff0ed;border-color:#c97669}.feedback{margin:20px 0 0;padding:16px;border-radius:12px;background:#f1f6f3;line-height:1.65}.next{margin-top:20px;background:#245d57;color:white;border:0;border-radius:11px;padding:14px 23px;font-size:15px;font-weight:700;cursor:pointer}.next:hover{background:#194640}.hidden{display:none}.finish{text-align:center;padding:22px 5px}.finish strong{display:block;font-size:58px;color:#245d57}.finish p{line-height:1.7;color:#60777b}@media(max-width:550px){.hero{padding:25px}.panel{padding:20px}.question{font-size:20px}}</style></head><body><main class="wrap"><a class="back" href="index.html">← Вернуться к каталогу</a><header class="hero"><div class="eyebrow">Математика · 5 класс · Интерактивная игра</div><h1>Лаборатория дробей</h1><p>Пройдите три этапа, решите 12 задач и заработайте до 180 баллов. После каждого ответа вы увидите объяснение.</p><div class="stats"><span>3 этапа</span><span>12 вопросов</span><span>Максимум 180 баллов</span></div></header><section class="panel" id="panel"><div class="small" id="stage"></div><div class="small" id="counter"></div><div class="progress"><div class="fill" id="fill"></div></div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><button class="next hidden" id="next" type="button">Следующий вопрос →</button></section></main><script>const questions=[{"stage": "Мир долей", "question": "Половина от 18 равна…", "options": ["6", "9", "12", "8"], "answer": 1, "explanation": "18 : 2 = 9.", "points": 10}, {"stage": "Мир долей", "question": "Какая дробь равна 1/2?", "options": ["2/3", "3/6", "3/8", "1/3"], "answer": 1, "explanation": "3/6 сокращается до 1/2.", "points": 10}, {"stage": "Мир долей", "question": "Какую часть часа составляют 15 минут?", "options": ["1/2", "1/3", "1/4", "1/5"], "answer": 2, "explanation": "15 из 60 минут — это 15/60 = 1/4.", "points": 10}, {"stage": "Мир долей", "question": "Какая дробь больше?", "options": ["3/8", "5/8", "1/8", "2/8"], "answer": 1, "explanation": "При равных знаменателях больше дробь с большим числителем.", "points": 10}, {"stage": "Дробные расчёты", "question": "Вычислите 2/7 + 3/7.", "options": ["5/14", "1/7", "5/7", "6/7"], "answer": 2, "explanation": "При одинаковом знаменателе складываем числители: 5/7.", "points": 15}, {"stage": "Дробные расчёты", "question": "Вычислите 6/9 − 2/9.", "options": ["4/9", "4/18", "8/9", "2/9"], "answer": 0, "explanation": "6/9 − 2/9 = 4/9.", "points": 15}, {"stage": "Дробные расчёты", "question": "Найдите 1/5 от 40.", "options": ["5", "8", "10", "20"], "answer": 1, "explanation": "40 : 5 = 8.", "points": 15}, {"stage": "Дробные расчёты", "question": "Какая дробь меньше 1?", "options": ["7/7", "9/8", "5/6", "8/5"], "answer": 2, "explanation": "У правильной дроби числитель меньше знаменателя.", "points": 15}, {"stage": "Геометрический сектор", "question": "Площадь прямоугольника 7 см на 4 см равна…", "options": ["11 см²", "22 см²", "28 см²", "14 см²"], "answer": 2, "explanation": "Площадь = 7 × 4 = 28 см².", "points": 20}, {"stage": "Геометрический сектор", "question": "Периметр прямоугольника 8 см на 3 см равен…", "options": ["24 см", "22 см", "11 см", "16 см"], "answer": 1, "explanation": "2 × (8 + 3) = 22 см.", "points": 20}, {"stage": "Геометрический сектор", "question": "Сколько градусов в прямом угле?", "options": ["45°", "60°", "90°", "180°"], "answer": 2, "explanation": "Прямой угол равен 90°.", "points": 20}, {"stage": "Геометрический сектор", "question": "Чему равна площадь квадрата со стороной 6 см?", "options": ["12 см²", "24 см²", "36 см²", "18 см²"], "answer": 2, "explanation": "6 × 6 = 36 см².", "points": 20}];let position=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){
 if(position>=questions.length){$('panel').innerHTML='<div class="finish"><div class="small">Миссия завершена</div><h2>Ваш результат</h2><strong>'+score+' / 180</strong><p>'+ (score>=145?'Прекрасная работа!':score>=95?'Хороший результат! Продолжайте тренироваться.':'Каждая попытка помогает учиться. Попробуйте ещё раз!')+'</p><button class="next" onclick="restart()">Пройти заново ↻</button></div>';return}
 const q=questions[position];answered=false;$('stage').textContent='Этап '+(Math.floor(position/4)+1)+' из 3 · '+q.stage;$('counter').textContent='Вопрос '+(position+1)+' из 12 · Баллы: '+score;$('fill').style.width=(position/12*100)+'%';$('question').textContent=q.question;$('options').replaceChildren();$('feedback').classList.add('hidden');$('next').classList.add('hidden');
 q.options.forEach((option,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+option;b.addEventListener('click',()=>choose(i));$('options').append(b)});
}
function choose(i){if(answered)return;answered=true;const q=questions[position];const good=i===q.answer;if(good)score+=q.points;Array.from($('options').children).forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(good?'Верно! +'+q.points+' баллов. ':'Не совсем. ')+q.explanation;$('feedback').classList.remove('hidden');$('next').textContent=position===11?'Посмотреть результат →':'Следующий вопрос →';$('next').classList.remove('hidden');}
$('next').addEventListener('click',()=>{position++;render()});
function restart(){location.reload()}
render();</script></body></html>
