<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Генетический код — биология, 9 класс</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#153a30;background:#ecf7f0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#b7efd4,transparent 42%),#ecf7f0;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:22px 16px 55px}a{color:#196d55;text-decoration:none;font-weight:700}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.chip{background:#d4f4e3;border:1px solid #b0e2c7;border-radius:30px;padding:9px 14px;font-size:13px;font-weight:700}h1{font-size:clamp(29px,5vw,47px);line-height:1.12;margin:28px 0 12px}p{line-height:1.55;color:#537368}.lead{max-width:620px}.card{background:white;border:1px solid #d6e9df;border-radius:25px;box-shadow:0 14px 38px #164e3020;padding:clamp(20px,5vw,38px);margin-top:26px}.stages{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stage{background:#e8f2ed;color:#5a776a;border-radius:14px;padding:10px 12px;font-size:12px;font-weight:700}.stage.active{background:#16684e;color:white}.stage.done{background:#b7e7cd;color:#155a43}.bar{height:12px;background:#e3f1e8;border-radius:20px;overflow:hidden;margin:18px 0 24px}.fill{height:100%;width:0;background:linear-gradient(90deg,#19aa77,#74dca2);transition:width .35s}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#537368;font-size:14px;font-weight:700}.question{font-size:clamp(20px,3.5vw,27px);font-weight:800;line-height:1.4;margin:24px 0}.options{display:grid;gap:11px}.option{border:2px solid #dbeae0;border-radius:14px;padding:16px;text-align:left;background:#f9fdfb;font:inherit;font-weight:650;color:#1c4a39;cursor:pointer;transition:.15s}.option:hover:not(:disabled){border-color:#35a87c;background:#eaf9f1}.option:disabled{cursor:default}.option.correct{border-color:#0d9e62;background:#d8f7e5}.option.wrong{border-color:#d85b55;background:#ffeded}.feedback{margin-top:18px;padding:17px;border-radius:14px;background:#edf7f0;display:none;line-height:1.55}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:5px}.next{background:#176f51;border:0;border-radius:13px;padding:14px 22px;color:white;font:inherit;font-weight:800;cursor:pointer;margin-top:19px;display:none}.next:hover{background:#0e533d}.finish{text-align:center}.finish h2{font-size:31px}.score{font-size:56px;font-weight:900;color:#16865b;margin:14px}.muted{font-size:13px;color:#698277}footer{margin-top:26px;text-align:center;font-size:13px;color:#698277}@media(max-width:520px){.card{border-radius:18px}.option{padding:13px}.stage{flex:1;text-align:center}}
</style></head><body><main class="wrap"><div class="top"><a href="index.html">← К банку игр</a><span class="chip">🧬 Биология · 9 класс</span></div><h1>🧬 Генетический код</h1><p class="lead">Расшифруй тайны наследственности: исследуй ДНК, разберись с аллелями и реши генетические задачи по законам Менделя!</p><div class="stages" id="stages"></div><section class="card" id="game"><div class="meta"><span id="counter"></span><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" type="button">Следующий вопрос →</button></section><footer>12 вопросов · 3 этапа · максимум 180 баллов · без регистрации</footer></main><script>
const questions=[{"question": "Как называется молекула, которая хранит наследственную информацию у человека?", "options": ["Белок", "ДНК", "Крахмал", "Глюкоза"], "answer": 1, "explanation": "ДНК содержит наследственную информацию, записанную последовательностью нуклеотидов."}, {"question": "Какие азотистые основания образуют пару в молекуле ДНК?", "options": ["Аденин и тимин", "Аденин и гуанин", "Тимин и цитозин", "Гуанин и тимин"], "answer": 0, "explanation": "По правилу комплементарности аденин соединяется с тимином, а гуанин — с цитозином."}, {"question": "Что называют геном?", "options": ["Любую клетку организма", "Участок ДНК, несущий информацию о функциональном продукте", "Всю цитоплазму клетки", "Мембрану ядра"], "answer": 1, "explanation": "Ген — участок ДНК, информация которого используется для образования РНК или белка."}, {"question": "Где у человека находится основная часть ДНК клетки?", "options": ["В клеточном ядре", "В лизосомах", "В аппарате Гольджи", "В клеточной мембране"], "answer": 0, "explanation": "Основная часть генетического материала клетки человека находится в ядре, в составе хромосом."}, {"question": "Как называется совокупность аллелей организма по определённому признаку?", "options": ["Фенотип", "Генотип", "Популяция", "Экосистема"], "answer": 1, "explanation": "Генотип — совокупность генетических вариантов организма; для одного признака рассматривают сочетание его аллелей."}, {"question": "Какая запись обозначает гетерозиготу по одному гену?", "options": ["AA", "aa", "Aa", "AAA"], "answer": 2, "explanation": "Гетерозигота имеет два разных аллеля одного гена: Aa."}, {"question": "При полном доминировании аллеля A над a какой генотип проявит рецессивный признак?", "options": ["AA", "Aa", "aa", "AA и Aa"], "answer": 2, "explanation": "При полном доминировании рецессивный признак проявляется только у гомозиготы aa."}, {"question": "Какие гаметы образует организм с генотипом Aa по рассматриваемому гену?", "options": ["Только A", "Только a", "A и a", "Aa"], "answer": 2, "explanation": "В каждую гамету попадает один из двух аллелей: A либо a."}, {"question": "При скрещивании Aa × Aa какова вероятность генотипа aa у потомка?", "options": ["0 %", "25 %", "50 %", "75 %"], "answer": 1, "explanation": "В решётке Пеннета получаются AA, Aa, Aa и aa: одна из четырёх комбинаций — aa."}, {"question": "При скрещивании AA × aa какими будут генотипы всех потомков первого поколения?", "options": ["AA", "aa", "Aa", "Поровну AA и aa"], "answer": 2, "explanation": "Каждый потомок получает A от первого родителя и a от второго, поэтому все имеют генотип Aa."}, {"question": "При полном доминировании A над a каково фенотипическое расщепление при Aa × Aa?", "options": ["1:1", "3:1", "1:2:1", "Все рецессивные"], "answer": 1, "explanation": "При полном доминировании три генотипические комбинации дают доминантный фенотип и одна — рецессивный."}, {"question": "Как называется правило расхождения двух аллелей одного гена по разным гаметам?", "options": ["Закон расщепления (сегрегации)", "Закон сохранения энергии", "Принцип Ле Шателье", "Правило экологической пирамиды"], "answer": 0, "explanation": "При образовании гамет два аллеля одного гена расходятся: каждая гамета получает один из них."}];
const names=['🧬 Тайны ДНК','🔬 Гены и аллели','🧩 Законы Менделя'];let current=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){if(current===questions.length){finish();return}answered=false;const q=questions[current];$('counter').textContent=`Вопрос ${current+1} из ${questions.length}`;$('points').textContent=`⭐ ${score} / 180 баллов`;$('fill').style.width=`${current/questions.length*100}%`;$('question').textContent=q.question;$('feedback').className='feedback';$('feedback').textContent='';$('next').style.display='none';$('next').textContent=current===11?'Завершить миссию ✓':'Следующий вопрос →';$('options').replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>choose(i);$('options').append(b)});$('stages').replaceChildren();names.forEach((n,i)=>{const e=document.createElement('span');e.className='stage'+(i===Math.floor(current/4)?' active':i<Math.floor(current/4)?' done':'');e.textContent=n;$('stages').append(e)})}
function choose(i){if(answered)return;answered=true;const q=questions[current],correct=i===q.answer,worth=[10,15,20][Math.floor(current/4)];if(correct)score+=worth;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=$('feedback');f.className='feedback show';const t=document.createElement('strong');t.textContent=correct?`✅ Верно! +${worth} баллов`:'💡 Не совсем верно';const e=document.createElement('span');e.textContent=q.explanation;f.append(t,e);$('points').textContent=`⭐ ${score} / 180 баллов`;$('fill').style.width=`${(current+1)/questions.length*100}%`;$('next').style.display='inline-block'}
$('next').onclick=()=>{current++;render()};function finish(){$('stages').replaceChildren();$('game').className='card finish';$('game').replaceChildren();const h=document.createElement('h2');h.textContent=score>=150?'🏆 Генетическая миссия выполнена!':score>=100?'💪 Отличный генетик!':'🔍 Исследуй генетику дальше!';const s=document.createElement('div');s.className='score';s.textContent=score+' / 180';const d=document.createElement('p');d.textContent=score>=150?'Отличное понимание генетики!':score>=100?'Хороший результат! Повтори трудные темы и попробуй ещё раз.':'Повтори системы органов и их основные функции.';const b=document.createElement('button');b.className='next';b.style.display='inline-block';b.textContent='↻ Пройти ещё раз';b.onclick=()=>{current=0;score=0;$('game').className='card';$('game').innerHTML='<div class="meta"><span id="counter"></span><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" type="button">Следующий вопрос →</button>';$('next').onclick=()=>{current++;render()};render()};$('game').append(h,s,d,b)}render();
</script></body></html>
