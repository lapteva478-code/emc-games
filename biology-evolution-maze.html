<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Эволюционный лабиринт — биология, 9 класс</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#153a30;background:#ecf7f0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#b7efd4,transparent 42%),#ecf7f0;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:22px 16px 55px}a{color:#196d55;text-decoration:none;font-weight:700}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.chip{background:#d4f4e3;border:1px solid #b0e2c7;border-radius:30px;padding:9px 14px;font-size:13px;font-weight:700}h1{font-size:clamp(29px,5vw,47px);line-height:1.12;margin:28px 0 12px}p{line-height:1.55;color:#537368}.lead{max-width:620px}.card{background:white;border:1px solid #d6e9df;border-radius:25px;box-shadow:0 14px 38px #164e3020;padding:clamp(20px,5vw,38px);margin-top:26px}.stages{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.stage{background:#e8f2ed;color:#5a776a;border-radius:14px;padding:10px 12px;font-size:12px;font-weight:700}.stage.active{background:#16684e;color:white}.stage.done{background:#b7e7cd;color:#155a43}.bar{height:12px;background:#e3f1e8;border-radius:20px;overflow:hidden;margin:18px 0 24px}.fill{height:100%;width:0;background:linear-gradient(90deg,#19aa77,#74dca2);transition:width .35s}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#537368;font-size:14px;font-weight:700}.question{font-size:clamp(20px,3.5vw,27px);font-weight:800;line-height:1.4;margin:24px 0}.options{display:grid;gap:11px}.option{border:2px solid #dbeae0;border-radius:14px;padding:16px;text-align:left;background:#f9fdfb;font:inherit;font-weight:650;color:#1c4a39;cursor:pointer;transition:.15s}.option:hover:not(:disabled){border-color:#35a87c;background:#eaf9f1}.option:disabled{cursor:default}.option.correct{border-color:#0d9e62;background:#d8f7e5}.option.wrong{border-color:#d85b55;background:#ffeded}.feedback{margin-top:18px;padding:17px;border-radius:14px;background:#edf7f0;display:none;line-height:1.55}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:5px}.next{background:#176f51;border:0;border-radius:13px;padding:14px 22px;color:white;font:inherit;font-weight:800;cursor:pointer;margin-top:19px;display:none}.next:hover{background:#0e533d}.finish{text-align:center}.finish h2{font-size:31px}.score{font-size:56px;font-weight:900;color:#16865b;margin:14px}.muted{font-size:13px;color:#698277}footer{margin-top:26px;text-align:center;font-size:13px;color:#698277}@media(max-width:520px){.card{border-radius:18px}.option{padding:13px}.stage{flex:1;text-align:center}}
</style></head><body><main class="wrap"><div class="top"><a href="index.html">← К банку игр</a><span class="chip">🧬 Биология · 9 класс</span></div><h1>🦋 Эволюционный лабиринт</h1><p class="lead">Пройди путь исследователя: разберись в механизмах эволюции, найди адаптации и открой доказательства родства организмов!</p><div class="stages" id="stages"></div><section class="card" id="game"><div class="meta"><span id="counter"></span><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" type="button">Следующий вопрос →</button></section><footer>12 вопросов · 3 этапа · максимум 180 баллов · без регистрации</footer></main><script>
const questions=[{"question": "Что называют эволюцией в биологии?", "options": ["Изменение наследственных признаков популяций в ряду поколений", "Рост отдельного организма", "Сезонную смену окраски листьев", "Любое перемещение животных"], "answer": 0, "explanation": "Биологическая эволюция — изменение наследственных характеристик популяций в поколениях."}, {"question": "Что является необходимым материалом для естественного отбора?", "options": ["Только одинаковые признаки особей", "Наследственная изменчивость", "Отсутствие размножения", "Одинаковая среда для всех видов"], "answer": 1, "explanation": "Естественный отбор действует на наследственные различия между особями."}, {"question": "Кто сформулировал теорию эволюции путём естественного отбора?", "options": ["Карл Линней", "Чарльз Дарвин", "Грегор Мендель", "Луи Пастер"], "answer": 1, "explanation": "Чарльз Дарвин обосновал эволюцию путём естественного отбора."}, {"question": "Какая единица считается элементарной единицей эволюции в школьном курсе биологии?", "options": ["Органоид", "Отдельная клетка", "Популяция", "Молекула воды"], "answer": 2, "explanation": "Частоты наследственных вариантов изменяются в популяциях из поколения в поколение."}, {"question": "Почему тёмные бабочки могут чаще выживать на потемневших стволах деревьев?", "options": ["Они становятся невидимыми для всех хищников", "Окраска делает их менее заметными некоторым хищникам", "Они перестают нуждаться в пище", "Все бабочки меняют гены по желанию"], "answer": 1, "explanation": "Маскировка может снижать риск быть замеченными хищниками, что влияет на выживание."}, {"question": "Какой пример лучше всего показывает адаптацию к засушливой среде?", "options": ["Широкие листья водяной лилии", "Уменьшение листьев до колючек у кактуса", "Жабры у рыбы", "Перепонки у утки"], "answer": 1, "explanation": "Колючки вместо крупных листьев помогают кактусам уменьшать потерю воды."}, {"question": "Что означает «естественный отбор»?", "options": ["Выживание и размножение особей с признаками, дающими преимущество в данной среде", "Сознательный выбор животными полезных мутаций", "Изменение признаков по желанию организма", "Искусственное скрещивание человеком"], "answer": 0, "explanation": "При естественном отборе носители некоторых наследственных признаков оставляют больше потомков."}, {"question": "Почему устойчивость бактерий к антибиотику может распространяться в популяции?", "options": ["Антибиотик обучает каждую бактерию", "Устойчивые бактерии могут выжить и дать потомство", "Все бактерии перестают делиться", "Устойчивость всегда исчезает после одного поколения"], "answer": 1, "explanation": "При воздействии антибиотика устойчивые варианты могут выживать и размножаться чаще."}, {"question": "Как называются органы с общим эволюционным происхождением, даже если функции различаются?", "options": ["Аналогичные", "Гомологичные", "Искусственные", "Рудиментарные"], "answer": 1, "explanation": "Гомологичные органы имеют общее происхождение; например, передние конечности человека и кита."}, {"question": "Какое свидетельство эволюции дают ископаемые остатки?", "options": ["Все виды всегда были неизменными", "Историю существования и изменения организмов в прошлом", "Только состав современной атмосферы", "Причины погоды"], "answer": 1, "explanation": "Ископаемые показывают разнообразие древних организмов и изменения жизни во времени."}, {"question": "Почему сходство последовательностей ДНК разных видов важно для изучения эволюции?", "options": ["Оно может свидетельствовать об общем происхождении", "Оно доказывает одинаковую среду обитания", "Оно означает, что все виды одинаковы", "Оно исключает наследственную изменчивость"], "answer": 0, "explanation": "Сходство генетических последовательностей помогает устанавливать эволюционное родство."}, {"question": "Какой пример относится к рудиментарным органам человека?", "options": ["Сердце", "Лёгкие", "Копчик", "Печень"], "answer": 2, "explanation": "Копчик — остаток хвостового отдела позвоночника предков человека."}];
const names=['🌱 Основы эволюции','🦋 Естественный отбор','🦴 Доказательства эволюции'];let current=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function render(){if(current===questions.length){finish();return}answered=false;const q=questions[current];$('counter').textContent=`Вопрос ${current+1} из ${questions.length}`;$('points').textContent=`⭐ ${score} / 180 баллов`;$('fill').style.width=`${current/questions.length*100}%`;$('question').textContent=q.question;$('feedback').className='feedback';$('feedback').textContent='';$('next').style.display='none';$('next').textContent=current===11?'Завершить миссию ✓':'Следующий вопрос →';$('options').replaceChildren();q.options.forEach((opt,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.onclick=()=>choose(i);$('options').append(b)});$('stages').replaceChildren();names.forEach((n,i)=>{const e=document.createElement('span');e.className='stage'+(i===Math.floor(current/4)?' active':i<Math.floor(current/4)?' done':'');e.textContent=n;$('stages').append(e)})}
function choose(i){if(answered)return;answered=true;const q=questions[current],correct=i===q.answer,worth=[10,15,20][Math.floor(current/4)];if(correct)score+=worth;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});const f=$('feedback');f.className='feedback show';const t=document.createElement('strong');t.textContent=correct?`✅ Верно! +${worth} баллов`:'💡 Не совсем верно';const e=document.createElement('span');e.textContent=q.explanation;f.append(t,e);$('points').textContent=`⭐ ${score} / 180 баллов`;$('fill').style.width=`${(current+1)/questions.length*100}%`;$('next').style.display='inline-block'}
$('next').onclick=()=>{current++;render()};function finish(){$('stages').replaceChildren();$('game').className='card finish';$('game').replaceChildren();const h=document.createElement('h2');h.textContent=score>=150?'🏆 Эволюционный лабиринт пройден!':score>=100?'💪 Отличный исследователь!':'🔍 Продолжай изучать эволюцию!';const s=document.createElement('div');s.className='score';s.textContent=score+' / 180';const d=document.createElement('p');d.textContent=score>=150?'Отличное знание эволюции и её доказательств!':score>=100?'Хороший результат! Повтори трудные темы и попробуй ещё раз.':'Повтори естественный отбор, адаптации и доказательства эволюции.';const b=document.createElement('button');b.className='next';b.style.display='inline-block';b.textContent='↻ Пройти ещё раз';b.onclick=()=>{current=0;score=0;$('game').className='card';$('game').innerHTML='<div class="meta"><span id="counter"></span><span id="points"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" type="button">Следующий вопрос →</button>';$('next').onclick=()=>{current++;render()};render()};$('game').append(h,s,d,b)}render();
</script></body></html>
